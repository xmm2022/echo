# Example nginx reverse proxy for Echo.
#
# Echo's JSON API takes only small request bodies (there is no file-upload entry
# point — ingest reads .cas trees from disk), while /api/stream/{file_id}
# reverse-proxies long-lived media. So we cap the body size and turn off
# buffering on the proxied location (spec §9).

server {
    listen 80;
    server_name echo.example.com;

    location /echo/ {
        proxy_pass http://echo:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JSON-only API, no upload entry point.
        client_max_body_size 1m;

        # Streaming endpoints must pass through unbuffered, with a long read
        # timeout for large media.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Emby clients connect here (server URL https://echo.example.com/emby).
    # PlaybackInfo mapped sources are rewritten to /emby/stream/{token} or
    # /emby/error/{token}; both proxy through this location unbuffered.
    location /emby/ {
        proxy_pass http://echo:8080/emby/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
