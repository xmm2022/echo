server:
  bind: ":8080"
  read_timeout: 30s
  write_timeout: 60s
  trust_proxy_headers: false

database:
  path: /data/echo.db

auth:
  # bootstrap_admin_token: operator credential used for initial admin browser
  # password setup and admin API token minting/recovery. It does NOT
  # authenticate ordinary /api or /ui requests. Required for `serve`.
  bootstrap_admin_token: "${ECHO_BOOTSTRAP_ADMIN_TOKEN}"
  # admin_token: deprecated v0.1 static credential, accepted for backward
  # compatibility only — not a long-term management credential. Manage access
  # via DB-backed API tokens minted through the bootstrap endpoint.
  # admin_token: "${ECHO_ADMIN_TOKEN}"
  session_cookie_name: echo_session
  session_ttl: 168h
  session_touch_interval: 5m
  secure_cookies: auto

sidecar:
  default:
    base_url: http://sidecar:5244
    auth_token_env: ECHO_SIDECAR_TOKEN
    # Exact-match gate against the version string Echo reads from the sidecar's
    # /api/public/settings (data.version). Empty = skip the version gate
    # (liveness via /ping is still required). Pin to the sidecar's release
    # tag/commit in production; the current guangyapan dev build reports
    # "dev (Commit: unknown) - Frontend: rolling - Build at: unknown".
    min_version: ""
    request_timeout: 60s
    stream_timeout: 10m

producer:
  workdir_root: /data/ingest
  secrets_root: /data/secrets
  default_timeout: 6h
  tools:
    "115share2cas":
      binary: /usr/local/bin/115share2cas
      api_args_allowlist:
        - "share_url"
        - "share_code"
        - "receive_code"
        - "cookie_file"
        - "mode"
        - "batch_size"
        - "temp_parent_cid"
        - "recycle_password_file"
        - "keep_temp"
        - "limit"

manual_import_roots: []

jobs:
  max_concurrent: 4
  worker_per_job: 4

echo_output_defaults:
  kind: local
  base_path: /data/output

log:
  level: info
  format: json

readiness:
  require_sidecar_contract: false
  require_sidecar_connectivity: false
  require_emby_connectivity: false

secrets_root: "/data/secrets"

emby_proxy:
  enabled: true
  config_sync: "seed_if_missing"
  public_base_url: "https://echo.example.com"
  proxy_prefix: "/emby"
  upstream:
    id: "default"
    name: "main-emby"
    base_url: "http://emby:8096"
    api_key_ref: "env:EMBY_API_KEY"
  playback:
    session_ttl: "12h"
    max_candidate_copies: 5
    redact_mapped_path: true
    mapped_only: false
  path_mappings:
    - library_id: 1
      emby_path_prefix: "/media/movies"
      echo_rel_prefix: "movies"
      case_sensitive: true

discovery:
  enabled: false
  max_concurrent: 2
  raw_debug:
    enabled: false
    max_bytes: 65536
    retention_days: 7
    storage_root: "/data/echo/discovery-raw"
  tmdb:
    api_key_ref: "env:TMDB_API_KEY"
    language: "zh-CN"
    cache_ttl: "24h"
  telegram:
    session_root: "/data/secrets/telegram"
    api_id: 0
    api_hash_ref: "env:TELEGRAM_API_HASH"
  poster:
    allowed_domains: []
