server:
  bind: ":8080"
  read_timeout: 30s
  write_timeout: 60s

database:
  path: /data/echo.db

auth:
  admin_token: "${ECHO_ADMIN_TOKEN}"

sidecar:
  default:
    base_url: http://sidecar:5244
    auth_token_env: ECHO_SIDECAR_TOKEN
    # Must exactly match the first sidecar version string Echo reads from
    # /api/public/settings or /ping. Replace this Phase 12 placeholder after the
    # real sidecar reports its commit/tag.
    min_version: "TBD-pending-real-sidecar-version"
    request_timeout: 60s
    stream_timeout: 10m

producer:
  workdir_root: /data/ingest
  secrets_root: /data/secrets
  default_timeout: 6h
  tools:
    "115share2cas":
      binary: /usr/local/bin/115share2cas
      api_args_allowlist:
        - "share_url"
        - "share_code"
        - "receive_code"
        - "cookie_file"
        - "mode"
        - "batch_size"
        - "temp_parent_cid"
        - "recycle_password_file"
        - "keep_temp"
        - "limit"

manual_import_roots: []

jobs:
  max_concurrent: 4
  worker_per_job: 4

echo_output_defaults:
  kind: local
  base_path: /data/output

log:
  level: info
  format: json
