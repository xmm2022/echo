name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      # Build tag `integration` runs against an in-process fake sidecar (no
      # network or secrets). `integration_real` (real sidecar + 115 account) is a
      # separate tag and is intentionally NOT run here; it is a manual,
      # secret-gated check. -race hardens the concurrency test.
      - run: go vet -tags=integration ./integration/...
      - run: go test -tags=integration -race ./integration/...
